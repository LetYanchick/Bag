<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    

    body {
      width: 340px;
      height: 100vh;
      background: #1e1e2e;
      border-radius: 16px;
      border: 1px solid #3d3d5c;
      font-family: -apple-system, 'Segoe UI', sans-serif;
      color: #cdd6f4;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .header {
      background: #181825;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-app-region: drag; /* шапку можно таскать */
      border-bottom: 1px solid #3d3d5c;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #cdd6f4;
      -webkit-app-region: no-drag;
    }

    .close-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: #6c7086;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .close-btn:hover { background: #313244; color: #f38ba8; }


    .tabs {
      display: flex;
      align-items: center;
      padding: 8px 12px 0;
      gap: 4px;
      background: #181825;
      flex-wrap: wrap;
      -webkit-app-region: no-drag;
    }

    .tab {
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      cursor: pointer;
      color: #6c7086;
      background: transparent;
      border: none;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .tab:hover { color: #cdd6f4; background: #313244; }

    .tab.active {
      color: #cdd6f4;
      background: #1e1e2e;
      font-weight: 600;
    }

    .tab-add {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: #6c7086;
      background: transparent;
      border: none;
    }

    .tab-add:hover { color: #a6e3a1; background: #313244; }


    .content {
      padding: 10px;
      max-height: 380px;
      overflow-y: auto;
      -webkit-app-region: no-drag;
    }

    .empty {
      text-align: center;
      color: #45475a;
      font-size: 13px;
      padding: 40px 20px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #313244;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
      border: 1px solid transparent;
    }

    .item:hover { background: #3d3d5c; border-color: #5b4fcf; }

    .item-content {
      flex: 1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cdd6f4;
    }

    .item-img {
      max-width: 100%;
      max-height: 80px;
      border-radius: 6px;
      object-fit: cover;
    }

    .item.image-item {
      flex-direction: column;
      align-items: flex-start;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #45475a;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .delete-btn:hover { color: #f38ba8; background: #45475a; }

    
    .toast {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
      background: #a6e3a1;
      color: #1e1e2e;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }
  </style>
</head>

<div id="tabInput" style="display:none; position:fixed; bottom:0; left:0; right:0; padding:10px; background:#181825; border-top:1px solid #3d3d5c; gap:6px; align-items:center;">
  <input id="tabName" type="text" placeholder="Название вкладки" style="flex:1; background:#313244; border:1px solid #3d3d5c; border-radius:6px; color:#cdd6f4; padding:6px 10px; font-size:13px; outline:none;">
  <button id="tabConfirm" style="background:#5b4fcf; border:none; border-radius:6px; color:white; padding:6px 12px; cursor:pointer;">OK</button>
  <button id="tabCancel" style="background:#313244; border:none; border-radius:6px; color:#cdd6f4; padding:6px 10px; cursor:pointer;">×</button>
</div>

<body>
  <div class="header">
    <span class="header-title">Мешок</span>
    <button class="close-btn" id="closeBtn">×</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content" id="content"></div>

  <div class="toast" id="toast">Скопировано!</div>
  

  <script src="renderer.js"></script>
</body>
</html>
